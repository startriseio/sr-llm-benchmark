name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate config, briefs and sources
    # pinned: the ubuntu-latest label migrates to Ubuntu 26 on 2026-10-19
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Chromium is only needed for the gates stage; skip the Playwright download in CI.
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Syntax-check every module
        run: for f in src/*.mjs scripts/*.mjs; do node --check "$f"; done
