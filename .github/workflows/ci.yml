name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests share one group per branch so a newer push cancels the older run.
# Pushes to main get a group per commit: GitHub keeps only one *queued* run per
# group and cancels the rest, which painted earlier commits red whenever two
# landed while runners were scarce. Every main commit now keeps its own verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate config, briefs and sources
    # pinned: the ubuntu-latest label migrates to Ubuntu 26 on 2026-10-19
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Chromium is only needed for the gates stage; skip the Playwright download in CI.
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Syntax-check every module
        run: for f in src/*.mjs scripts/*.mjs; do node --check "$f"; done
